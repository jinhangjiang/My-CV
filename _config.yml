title: Jinhang Jiang's CV
description: Professional CV of Jinhang Jiang
show_downloads: false

# Build settings
markdown: kramdown
permalink: pretty

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .github
  - .gitignore
  - .jekyll-cache
  - _site

# Collections
collections:
  - assets
  - media

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "cv"
  - scope:
      path: "assets"
      type: "assets"
    values:
      layout: null
  - scope:
      path: "media"
      type: "media"
    values:
      layout: null
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Jinhang Jiang"

# Sass
sass:
  style: compressed
  load_paths:
    - _sass
  sass_dir: _sass

# Site settings
url: "https://jinhangjiang.com"
baseurl: "/My-CV"

# Google Analytics
google_analytics: G-DRC2GHV21Q
